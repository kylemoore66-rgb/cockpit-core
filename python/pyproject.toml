[project]
name = "cockpit-core"
version = "0.1.0"
description = "Open betting math and track-record proofs behind Cockpit"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = ["rfc8785>=0.1.4,<0.2", "jsonschema>=4.23"]

[project.urls]
Repository = "https://github.com/kylemoore66-rgb/cockpit-core"

[project.optional-dependencies]
stats = ["numpy>=2.5.4"]

[project.scripts]
cockpit-verify = "cockpit_core.verify:main"

[dependency-groups]
dev = ["pytest", "ruff", "numpy>=2.5.4"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cockpit_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
